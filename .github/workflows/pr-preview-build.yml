name: PR Preview Build

on:
  pull_request:
    types: [synchronize, reopened, ready_for_review, labeled, unlabeled]

permissions:
  contents: read

concurrency:
  group: pr-preview-build-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  decide:
    name: Check preview eligibility
    runs-on: ubuntu-latest
    if: >-
      (github.event.action != 'labeled' && github.event.action != 'unlabeled')
      || (github.event.action == 'labeled' && (github.event.label.name == 'core'
      || github.event.label.name == 'preview' || github.event.label.name ==
      'skip-preview')) || (github.event.action == 'unlabeled' &&
      github.event.label.name == 'skip-preview')
    outputs:
      build: ${{ steps.check.outputs.build }}
      head_sha: ${{ steps.check.outputs.head_sha }}
    steps:
      - id: check
        name: Check PR labels and state
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            if (!pr || pr.state !== 'open' || pr.merged) {
              core.setOutput('build', 'false');
              return;
            }

            const labels = (pr.labels || []).map((l) => l.name);
            if (labels.includes('skip-preview')) {
              core.info('PR has skip-preview label; skipping.');
              core.setOutput('build', 'false');
              return;
            }

            const shouldBuild =
              labels.includes('preview') ||
              (labels.includes('core') && !pr.draft);

            core.setOutput('build', String(shouldBuild));
            core.setOutput('head_sha', pr.head.sha);

  build:
    name: Build static preview
    needs: decide
    if: needs.decide.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/head
          fetch-depth: 0 # generate-removed.js reads git log
          persist-credentials: false

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build docs
        run: pnpm docs:build

      - name: Upload preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: pr-preview-dist
          path: docs/.vitepress/dist
          retention-days: 1
          if-no-files-found: error
